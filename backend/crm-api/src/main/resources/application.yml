spring:
  application:
    name: autoservice-crm
  datasource:
    url: jdbc:postgresql://localhost:5432/crm
    username: crm
    password: crm
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
